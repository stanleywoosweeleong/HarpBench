name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check every script parses
        run: for f in js/*.js songs.js pwa.js sw.js; do node --check "$f"; done
      - name: Build the single-file version
        run: mkdir -p dist && python3 tools/build_artifact.py dist/harp-bench.html
